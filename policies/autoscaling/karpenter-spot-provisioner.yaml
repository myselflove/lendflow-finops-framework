apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: batch-analytics-spot
spec:
  template:
    metadata:
      labels:
        finops.lendflow.io/pricing: spot
        finops.lendflow.io/workload: batch
    spec:
      requirements:
      - key: "karpenter.sh/capacity-type"
        operator: In
        values: ["spot"]
      - key: "kubernetes.io/arch"
        operator: In
        values: ["arm64", "amd64"]
      - key: "karpenter.k8s.aws/instance-category"
        operator: In
        values: ["c", "m", "r"]
      - key: "karpenter.k8s.aws/instance-generation"
        operator: In
        values: ["6", "7"]
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1beta1
        kind: EC2NodeClass
        name: default
  disruption:
    consolidationPolicy: WhenUnderutilized
    expireAfter: 720h
  limits:
    cpu: "200"
    memory: 800Gi

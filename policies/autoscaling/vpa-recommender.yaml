apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: lendflow-fleet-vpa-recommender
  namespace: lendflow-production
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lendflow-auth
  updatePolicy:
    updateMode: "Off" # Recommender only to prevent pod disruption during active lending hours
  resourcePolicy:
    containerPolicies:
    - containerName: '*'
      minAllowed:
        cpu: 100m
        memory: 128Mi
      maxAllowed:
        cpu: 4000m
        memory: 8Gi
      controlledResources: ["cpu", "memory"]

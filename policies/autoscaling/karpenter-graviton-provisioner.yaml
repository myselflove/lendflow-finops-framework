apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: steady-state-graviton3
spec:
  template:
    metadata:
      labels:
        finops.lendflow.io/arch: arm64
        finops.lendflow.io/generation: graviton3
    spec:
      requirements:
      - key: "karpenter.sh/capacity-type"
        operator: In
        values: ["on-demand"]
      - key: "kubernetes.io/arch"
        operator: In
        values: ["arm64"]
      - key: "node.kubernetes.io/instance-type"
        operator: In
        values: ["c7g.xlarge", "c7g.2xlarge", "m7g.xlarge", "m7g.2xlarge", "r7g.xlarge"]
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1beta1
        kind: EC2NodeClass
        name: graviton-optimized
  disruption:
    consolidationPolicy: WhenEmpty
  limits:
    cpu: "500"
    memory: 2000Gi

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lendflow-gateway-hpa
  namespace: lendflow-production
  labels:
    app.kubernetes.io/name: lendflow-gateway
    finops.lendflow.io/cost-center: engineering
    finops.lendflow.io/service: lendflow-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lendflow-gateway
  minReplicas: 2
  maxReplicas: 12
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 20
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
